apiVersion: apps/v1
kind: Deployment

metadata:
  name: jenkins-k8s-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: jenkins-k8s-app

  template:
    metadata:
      labels:
        app: jenkins-k8s-app

    spec:
      containers:
        - name: nginx
          image: jenkins-k8s-lab:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80
